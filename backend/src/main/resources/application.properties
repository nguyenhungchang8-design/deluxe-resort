server.port=8080

# ---- SQL Server (sua lai cho dung may cua ban) ----
# Can tao san database: CREATE DATABASE deluxe_db;
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=deluxe_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Origin cua frontend (Live Server, v.v.)
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8081
