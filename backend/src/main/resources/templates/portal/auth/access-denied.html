<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Deluxe - Từ chối truy cập</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/open-iconic-bootstrap.min.css">
    <link rel="stylesheet" href="../../css/animate.css">
    <link rel="stylesheet" href="../../css/icomoon.css">
    <link rel="stylesheet" href="../../css/style.css">
  </head>
  <body>
    <div class="hero-wrap" style="background-image: url('../../images/bg_1.jpg');">
      <div class="overlay"></div>
      <div class="container">
        <div class="row no-gutters slider-text d-flex align-items-center justify-content-center" style="height:100vh">
          <div class="col-md-9 text-center">
            <h1 class="mb-3 bread" style="font-size: 3rem; font-weight: 700;">403 - Từ chối truy cập</h1>
            <p class="mb-4" style="font-size: 1.2rem; color: #ddd;">Bạn không có quyền truy cập vào trang này hoặc phiên làm việc đã hết hạn.</p>
            <a href="#" id="go-home" class="btn btn-primary py-3 px-5" style="border-radius: 50px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600;">Về trang của tôi</a>
          </div>
        </div>
      </div>
    </div>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
      document.getElementById('go-home').addEventListener('click', function (e) {
        e.preventDefault();
        var u = getUser();
        window.location.href = u ? homeFor(u.role) : 'login.html';
      });
    </script>
  </body>
</html>
